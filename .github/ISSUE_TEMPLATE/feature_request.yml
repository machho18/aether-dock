name: 功能建议
description: 提出清晰、可讨论的功能建议
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      placeholder: 请描述真实使用场景与当前阻碍。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      placeholder: 请说明希望的交互或行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      placeholder: 可选，说明你已考虑过的其他方式。
    validations:
      required: false
