name: 缺陷报告
description: 报告可以稳定复现的问题
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿在此提交密钥、个人资料或安全漏洞细节。
  - type: input
    id: version
    attributes:
      label: AetherDock 版本
      placeholder: 例如 v0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统环境
      placeholder: 例如 Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请按顺序说明操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与截图
    validations:
      required: true
